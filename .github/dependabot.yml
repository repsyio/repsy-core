version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:20"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    # Minor and patch bumps share one PR; majors stay individual so they get reviewed alone.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:20"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    # Minor and patch bumps share one PR; majors stay individual so they get reviewed alone.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
