name: MR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: There must be only one .editorconfig file
        run: |
          if [ "$(find . -name '.editorconfig' | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
        with:
          version: v3.0.3

      - run: editorconfig-checker

  java-checks:
    name: Java Core Lib check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: License Header Check
        run: mvn -B -ntp apache-rat:check

      - name: Build and Verify
        run: mvn -B -ntp verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error
