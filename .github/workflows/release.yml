name: Release | Core

on:
  workflow_dispatch:

# This workflow tags the release, deploys it to repo.repsy.io (RPS-2264) and opens the release pull
# request.
#
# `main` only accepts changes through a pull request (ruleset `protect default`), and neither the
# workflow token nor the repsy-release-bot App is a bypass actor, so this workflow never pushes to
# `main`. It pushes the release commits to a `release/<tag>` branch and opens a pull request with
# the App token (RPS-2268): a pull request opened with `github.token` triggers no `pull_request`
# workflows, so its required checks would never report. The workflow does not merge it, because
# auto-merge is off for the repository: a person merges it.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: hetzner-md
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          # The checkout above keeps its credentials for the later git push. The action's own
          # checkout runs with persist-credentials: false and would remove them, and the push of
          # the release branch and the tag would then fail with "could not read Username".
          checkout-enabled: false
          # The JDK step below owns the Temurin JDK and the Maven cache.
          cache-enabled: false
          java-distribution: temurin

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      # Fail before anything is tagged or pushed: a release without credentials would otherwise
      # leave a tag and a release branch behind that have to be deleted by hand.
      - name: Check registry and App credentials
        env:
          REPSY_MAVEN_USERNAME: ${{ secrets.REPSY_MAVEN_USERNAME }}
          REPSY_MAVEN_TOKEN: ${{ secrets.REPSY_MAVEN_TOKEN }}
          REPSY_BOT_APP_ID: ${{ vars.REPSY_BOT_APP_ID }}
          REPSY_BOT_APP_PRIVATE_KEY: ${{ secrets.REPSY_BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$REPSY_MAVEN_USERNAME" ] || [ -z "$REPSY_MAVEN_TOKEN" ]; then
            echo "The REPSY_MAVEN_USERNAME and REPSY_MAVEN_TOKEN Actions secrets are not set" >&2
            exit 1
          fi
          if [ -z "$REPSY_BOT_APP_ID" ] || [ -z "$REPSY_BOT_APP_PRIVATE_KEY" ]; then
            echo "The REPSY_BOT_APP_ID variable and REPSY_BOT_APP_PRIVATE_KEY secret of the repsy-release-bot App are not available to this repository" >&2
            exit 1
          fi

      # Minted before anything is tagged, so a missing App installation fails the run here and not
      # after a version has been published. A token lives one hour and the job at most 30 minutes.
      # It is limited to this repository. The pull request title check skips this App
      # (pr-title.yml), so the pull request needs no Jira key.
      - name: Create the GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.REPSY_BOT_APP_ID }}
          private-key: ${{ secrets.REPSY_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # release:prepare commits the release and next development versions and creates the tag,
      # so it needs a committer identity.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `pushChanges` is false in the root pom: this only commits and tags locally.
      - name: Run release:prepare
        run: |
          mvn -B release:prepare \
            -Dmaven.test.skip=true \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Push release branch and tag
        id: push
        run: |
          tag="$(sed -n 's/^scm\.tag=//p' release.properties)"
          if [ -z "$tag" ]; then
            echo "release.properties has no scm.tag; release:prepare did not complete" >&2
            exit 1
          fi
          branch="release/${tag}"
          git checkout -b "$branch"
          git push origin "$branch" "$tag"
          {
            echo "tag=${tag}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      # Deploys the tagged commit, not the checkout (which is at the next development version), from
      # a separate worktree so release.properties and the release backups stay out of the build.
      # The tests were skipped by release:prepare for the same reason as here: the commit on main
      # passed them in the pull request checks. A failure here leaves the tag and the release
      # branch behind: delete them as described in AGENTS.md before running the workflow again.
      # The settings file comes from the workspace, not the tagged commit, which does not have it;
      # it reads the credentials from the environment of this step.
      - name: Deploy the release to repo.repsy.io
        env:
          REPSY_MAVEN_USERNAME: ${{ secrets.REPSY_MAVEN_USERNAME }}
          REPSY_MAVEN_TOKEN: ${{ secrets.REPSY_MAVEN_TOKEN }}
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          git worktree add "$RUNNER_TEMP/release" "$TAG"
          cd "$RUNNER_TEMP/release"
          mvn -B deploy \
            -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" \
            -Dmaven.test.skip=true \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true
          echo "Deployed ${TAG#v} to https://repo.repsy.io/repsy/repsy-maven" >> "$GITHUB_STEP_SUMMARY"

      # Not merged here: auto-merge is off, and the App is no bypass actor of the ruleset. A person
      # merges it once its checks are green (an organization admin may use the bypass).
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.push.outputs.tag }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release ${TAG#v}" \
            --body "Release commits made by \`release:prepare\` in the Release | Core workflow: the release version, tagged \`${TAG}\` and deployed to https://repo.repsy.io/repsy/repsy-maven, then the next development version. Merging this pull request moves \`main\` to the next development version.")"
          echo "Release pull request, to be merged by a person: ${url}" >> "$GITHUB_STEP_SUMMARY"
