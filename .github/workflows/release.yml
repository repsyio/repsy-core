name: Release | Core

on:
  workflow_dispatch:

# `main` only accepts changes through a pull request, and the workflow token is not a bypass actor
# of the `main-branch-protection` ruleset, so this workflow never pushes to `main`. It pushes the
# release commits to a `release/<tag>` branch and merges them with a pull request instead.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: warp-ubuntu-latest-x64-2x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      # release:prepare commits the release and next development versions and creates the tag,
      # so it needs a committer identity.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `pushChanges` is false in the root pom: this only commits and tags locally.
      - name: Run release:prepare
        run: |
          mvn -B release:prepare \
            -Dmaven.test.skip=true \
            -Dcheckstyle.skip=true \
            -Dfmt.skip=true

      - name: Push release branch and tag
        id: push
        run: |
          tag="$(sed -n 's/^scm\.tag=//p' release.properties)"
          if [ -z "$tag" ]; then
            echo "release.properties has no scm.tag; release:prepare did not complete" >&2
            exit 1
          fi
          branch="release/${tag}"
          git checkout -b "$branch"
          git push origin "$branch" "$tag"
          {
            echo "tag=${tag}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Open and merge the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.push.outputs.tag }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release ${TAG#v}" \
            --body "Release commits made by \`release:prepare\` in the Release | Core workflow: the release version, tagged \`${TAG}\`, then the next development version. Merging this pull request moves \`main\` to the next development version.")"
          # Auto-merge when checks or the merge queue still have to report, a plain merge when
          # the pull request is already mergeable.
          gh pr merge "$url" --auto --squash || gh pr merge "$url" --squash
          echo "Release pull request: ${url}" >> "$GITHUB_STEP_SUMMARY"
