name: CodeQL

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 2 * * 1"

jobs:
  analyze:
    name: Analyze Java
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: java
          build-mode: manual

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true -Dfmt.skip=true -Drat.skip=true package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
