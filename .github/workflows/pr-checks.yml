name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: hetzner-sm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: There must be only one .editorconfig file
        run: |
          if [ "$(find . -name '.editorconfig' | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker

  java-checks:
    name: Java Core Lib check
    runs-on: hetzner-md
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false
          # The JDK step below owns the Temurin JDK and the Maven cache; without these two the
          # action installs Zulu and keeps a second ~/.m2 cache.
          cache-enabled: false
          java-distribution: temurin

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: License Header Check
        run: mvn -B -ntp apache-rat:check

      - name: Build and Verify
        run: mvn -B -ntp verify

      - name: Analyze with SonarCloud
        # Dependabot-triggered and fork runs don't receive regular repo secrets, so SONAR_TOKEN is
        # empty.
        # sonarcloud.yml analyses main on a schedule.
        if: >-
          github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy-core
          -Dsonar.organization=repsy
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error
