name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  # The merge queue on main builds every queued PR on top of the ones ahead of it and reports
  # these same checks. Without this trigger, queued entries never get a result and time out.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: There must be only one .editorconfig file
        run: |
          if [ "$(find . -name '.editorconfig' | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker

  java-checks:
    name: Java Core Lib check
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: License Header Check
        run: mvn -B -ntp apache-rat:check

      - name: Build and Verify
        run: mvn -B -ntp verify

      - name: Analyze with SonarCloud
        # Dependabot-triggered runs don't receive regular repo secrets, so SONAR_TOKEN is empty.
        # Merge queue runs would analyse a gh-readonly-queue/* branch that no PR owns, and
        # sonarcloud.yml analyses main right after the merge anyway.
        if: github.actor != 'dependabot[bot]' && github.event_name != 'merge_group'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy-core
          -Dsonar.organization=repsy
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error
